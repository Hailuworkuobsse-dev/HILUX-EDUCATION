version: '3.8'

services:
  mysql:
    image: mysql:8
    container_name: examprep-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: examprep
      MYSQL_USER: examprep
      MYSQL_PASSWORD: examprep
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data:
